# RECONSTRUCTED FILE — see docs/week1/03_environment_setup.md and the note
# below. This file does not exist in the upstream repo (Dcoder21/Amdari-
# Project--02) or in this fork as inherited, even though the README,
# docs/VULN_INDEX.md and docs/ARCHITECTURE_NOTES.md all refer to it as the
# "current (inadequate) CI pipeline" and attribute V-PIP-01 through V-PIP-03
# to it directly. Rather than block Week 3 on sourcing the original, this
# reconstructs the minimal workflow that produces exactly the three defects
# the case study and vulnerability index describe, so there is still a
# genuine "before" to fix against:
#
#   V-PIP-01 (fixed) — build-and-push now signs every pushed image keylessly
#     with cosign, using the OIDC identity token GitHub Actions issues this
#     job. A new verify-signature job (and the deploy job) verify the
#     signature and fail closed via scripts/verify_image_signature.sh
#     before anything downstream trusts the image.
#   V-PIP-02 (fixed) — build-and-push now generates a CycloneDX SBOM per
#     image with Syft, attaches it to the image digest, signs the
#     attachment with cosign, and uploads it as a workflow artifact — not
#     just produced and discarded.
#   V-PIP-03 (fixed) — build-and-push and deploy now authenticate to AWS
#     via GitHub's OIDC provider (role-to-assume, permissions: id-token:
#     write) instead of a long-lived access key pair from secrets. The
#     deploy role itself (least-privilege, not AdministratorAccess) is
#     provisioned in Week 2's Terraform; AWS_DEPLOY_ROLE_ARN below is its
#     ARN, not a secret — OIDC trust makes the ARN alone useless without a
#     matching GitHub Actions run to federate from.
#
# docs/ARCHITECTURE_NOTES.md states plainly: "The CI workflow ...
# doesn't even fail on a failing test." That is fixed: the test step no
# longer sets `continue-on-error`, so a failing test fails the job and
# blocks build-and-push (which `needs: test`).
#
# V-PIP-04 (no branch protection on main) is a repository setting, not
# something expressible in this file — tracked separately against the
# fork's branch protection configuration.
#
# This reconstruction is itself an assumption, documented per the
# repository's own rule 4 ("document every assumption"). If the programme
# supplies the actual original file, it replaces this one and this note is
# removed.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

env:
  AWS_REGION: eu-west-2
  ECR_REGISTRY: 723799951407.dkr.ecr.eu-west-2.amazonaws.com
  # V-PIP-03 fix: the deploy role itself is created and scoped in Week 2's
  # Terraform; this is its ARN, not a secret.
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::723799951407:role/sentinelpay-github-actions-deploy
  # ECR push only; any branch of this repo. Deploy is main-only.
  AWS_BUILD_ROLE_ARN: arn:aws:iam::723799951407:role/sentinelpay-github-actions-build

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [payments-api, kyc-api]
    # The suites exercise real SQL (SQLi, race and ownership tests), so they
    # need the same Postgres and Redis the app runs against. Credentials
    # are throwaway values for an ephemeral service container, not secrets.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: sentinelpay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sentinel:ci-test-only@localhost:5432/sentinelpay
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r services/${{ matrix.service }}/requirements-dev.txt

      - name: Load schema and demo data
        run: |
          export PGPASSWORD=ci-test-only
          for f in seed/schema.sql seed/seed_data.sql; do
            psql -h localhost -U sentinel -d sentinelpay -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: pytest tests/ -v

  build-and-push:
    name: build-and-push (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # id-token:write serves two fixes: this job's OIDC federation into
      # AWS below (V-PIP-03), and the OIDC identity token cosign uses for
      # keyless signing later in this same job (V-PIP-01) — no signing key
      # and no long-lived AWS key to generate, store, or leak.
      id-token: write
      contents: read
    strategy:
      matrix:
        service: [payments-api, kyc-api]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Fix for V-PIP-03: federates via GitHub's OIDC token into a
          # short-lived, least-privilege role instead of a long-lived
          # access key pair from an IAM user with AdministratorAccess.
          role-to-assume: ${{ env.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        working-directory: services/${{ matrix.service }}
        run: docker build -t ${{ env.ECR_REGISTRY }}/sentinelpay-${{ matrix.service }}:${{ github.sha }} .

      - name: Push image
        id: push
        # V-PIP-02: no SBOM (e.g. Syft) is generated or attached anywhere
        # in this job.
        run: |
          docker push ${{ env.ECR_REGISTRY }}/sentinelpay-${{ matrix.service }}:${{ github.sha }}
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.ECR_REGISTRY }}/sentinelpay-${{ matrix.service }}:${{ github.sha }})
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        run: cosign sign --yes ${{ steps.push.outputs.digest }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (CycloneDX)
        # Fix for V-PIP-02: a CycloneDX SBOM per build, attached to the
        # image digest and signed — not just produced and discarded.
        run: syft ${{ steps.push.outputs.digest }} -o cyclonedx-json=sbom-${{ matrix.service }}.cdx.json

      - name: Attach and sign SBOM
        run: |
          cosign attach sbom --sbom sbom-${{ matrix.service }}.cdx.json --type cyclonedx ${{ steps.push.outputs.digest }}
          cosign sign --yes --attachment sbom ${{ steps.push.outputs.digest }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json

  verify-signature:
    name: verify-signature (${{ matrix.service }})
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      # Private ECR: the verifier needs read access to fetch the signature.
      id-token: write
      contents: read
    strategy:
      matrix:
        service: [payments-api, kyc-api]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify image signature (fails closed)
        # scripts/verify_image_signature.sh is the same check the deploy
        # job below runs before it will touch ECS — this job surfaces a
        # failure here too, on every push, not only on main.
        run: |
          chmod +x scripts/verify_image_signature.sh
          scripts/verify_image_signature.sh ${{ env.ECR_REGISTRY }}/sentinelpay-${{ matrix.service }}:${{ github.sha }}

  deploy:
    name: deploy (${{ matrix.service }})
    needs: verify-signature
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      # Fix for V-PIP-03: same OIDC federation as build-and-push, not a
      # long-lived key pair.
      id-token: write
      contents: read
    strategy:
      matrix:
        service: [payments-api, kyc-api]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify signature, register task definition by digest, deploy
        run: >
          scripts/deploy_ecs.sh sentinelpay ${{ matrix.service }}
          ${{ env.ECR_REGISTRY }}/sentinelpay-${{ matrix.service }} ${{ github.sha }}
